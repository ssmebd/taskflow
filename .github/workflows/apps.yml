name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: apps/android
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 @capacitor/push-notifications@6
          npx cap add android
          mkdir -p assets && cp icon-only.png assets/icon-only.png && cp icon-only.png assets/icon-foreground.png && cp icon-background.png assets/icon-background.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0f2a5c' --iconBackgroundColorDark '#0f2a5c'
          # Firebase (phone notifications): commit apps/android/google-services.json to enable
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk TaskFlow.apk
      - uses: actions/upload-artifact@v4
        with: { name: TaskFlow-android, path: TaskFlow.apk }
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with: { files: TaskFlow.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build installer
        working-directory: apps/desktop
        run: |
          npm install
          npm run dist
      - name: Collect installer
        shell: bash
        run: cp "apps/desktop/dist/"*Setup*.exe TaskFlow-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: TaskFlow-windows, path: TaskFlow-Setup.exe }
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with: { files: TaskFlow-Setup.exe }
