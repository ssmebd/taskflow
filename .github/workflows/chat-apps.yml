name: Build chat apps
on:
  workflow_dispatch:
  push:
    tags: ['chat-v*']
permissions:
  contents: write
jobs:
  android-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create Android project
        working-directory: apps/chat-android
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 @capacitor/push-notifications@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          mkdir -p assets && cp icon-only.png assets/icon-only.png && cp icon-only.png assets/icon-foreground.png && cp icon-background.png assets/icon-background.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0f2a5c' --iconBackgroundColorDark '#0f2a5c'
          # Firebase (phone notifications): commit apps/chat-android/google-services.json (it must list the package com.gurucadd.taskflow.chat)
          # Without Firebase config the app must not try to register for push (that crashes it). The marker below tells the page it is safe.
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            node -e "const f='capacitor.config.json',c=require('./'+f);c.android=c.android||{};c.android.appendUserAgent='TFPush';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          fi
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/chat-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Collect APK
        run: cp apps/chat-android/android/app/build/outputs/apk/debug/app-debug.apk TaskFlow-Chat.apk
      - uses: actions/upload-artifact@v4
        with: { name: TaskFlow-Chat-android, path: TaskFlow-Chat.apk }
      - if: startsWith(github.ref, 'refs/tags/chat-v')
        uses: softprops/action-gh-release@v2
        with: { files: TaskFlow-Chat.apk }
  windows-chat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build installer
        working-directory: apps/chat-desktop
        run: |
          npm install
          npm run dist
      - name: Collect installer
        shell: bash
        run: cp "apps/chat-desktop/dist/"*Setup*.exe TaskFlow-Chat-Setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: TaskFlow-Chat-windows, path: TaskFlow-Chat-Setup.exe }
      - if: startsWith(github.ref, 'refs/tags/chat-v')
        uses: softprops/action-gh-release@v2
        with: { files: TaskFlow-Chat-Setup.exe }
